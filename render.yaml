# ============================================================================
# Render Blueprint — Nexus AI Work OS
# https://render.com/docs/blueprint-spec
#
# Deploy backend (FastAPI) + frontend (Next.js) as separate web services,
# plus a managed PostgreSQL database.
#
# Usage:
#   1. Push this repo to GitHub
#   2. In the Render Dashboard → New → Blueprint → select this repo
#   3. Render reads this file and creates all three resources automatically
# ============================================================================

databases:
  - name: nexus-db
    plan: free
    region: singapore
    databaseName: nexus_db
    user: nexus_user

services:
  # ─── Backend: FastAPI Python API ──────────────────────────────────────
  - type: web
    name: nexus-api
    runtime: python
    region: singapore
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn main:app --workers 2 --worker-class uvicorn.workers.UvicornWorker --bind 0.0.0.0:$PORT --timeout 120 --keep-alive 5 --preload
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: nexus-db
          property: connectionURI
      - key: SECRET_KEY
        generateValue: true
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "1440"
      - key: APP_ENV
        value: production
      - key: LLM_PROVIDER
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: NEXUS_PUBLIC_API_URL
        sync: false
      - key: N8N_WEBHOOK_URL
        sync: false
      - key: META_WA_PHONE_NUMBER_ID
        sync: false
      - key: META_WA_ACCESS_TOKEN
        sync: false
      - key: META_WA_VERIFY_TOKEN
        sync: false
      - key: META_APP_SECRET
        sync: false

  # ─── Frontend: Next.js React App ─────────────────────────────────────
  - type: web
    name: nexus-frontend
    runtime: node
    region: singapore
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NEXT_PUBLIC_API_URL
        sync: false
      - key: NODE_VERSION
        value: "20.11.0"
